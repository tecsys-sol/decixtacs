[project]
name = "networkops"
version = "0.1.0"
description = "Typed Python client for the NetworkOps Manager API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
classifiers = [
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
networkops = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
files = ["src"]
