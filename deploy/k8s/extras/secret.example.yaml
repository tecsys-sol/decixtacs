# Shape of the Secrets the ExternalSecrets produce - for reference / air-gapped clusters only.
# NEVER commit real values. Generate:
#   NOM_JWT_SECRET:       openssl rand -base64 48
#   NOM_ENCRYPTION_KEYS:  docker run --rm ghcr.io/tecsys-sol/decixtacs/backend cli genkey
apiVersion: v1
kind: Secret
metadata:
  name: nom-secrets
  namespace: networkops
type: Opaque
stringData:
  NOM_DATABASE_URL: postgresql+psycopg://nom:CHANGE_ME@nom-db-rw:5432/nom?sslmode=require
  NOM_REDIS_URL: redis://:CHANGE_ME@redis.example.internal:6379/0
  NOM_JWT_SECRET: CHANGE_ME_AT_LEAST_32_CHARACTERS_LONG________
  NOM_ENCRYPTION_KEYS: CHANGE_ME_FERNET_KEY=
  NOM_LDAP_BIND_PASSWORD: ""
  NOM_OIDC_CLIENT_SECRET: ""
  NOM_SMTP_USERNAME: ""
  NOM_SMTP_PASSWORD: ""
  NOM_INIT_ADMIN_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: nom-tacacs-agent
  namespace: networkops
type: Opaque
stringData:
  nom-tacacs-0: nomagent_CHANGE_ME
  nom-tacacs-1: nomagent_CHANGE_ME
