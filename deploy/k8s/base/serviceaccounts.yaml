# Dedicated service accounts without API tokens: no workload talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nom-backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nom-frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nom-tacacs
automountServiceAccountToken: false
