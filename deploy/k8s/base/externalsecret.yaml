# Secrets are synchronised from your secret manager by the External Secrets Operator
# (https://external-secrets.io). Nothing secret is stored in Git.
#
# The ClusterSecretStore name and the remote key are examples (Vault KV / AWS Secrets Manager /
# GCP Secret Manager / Azure Key Vault all work). The remote secret
# "networkops/<env>/app" must contain these properties (use "" for unused ones):
#   database_url, redis_url, jwt_secret, encryption_keys, ldap_bind_password,
#   oidc_client_secret, smtp_username, smtp_password, init_admin_password
# Overlays only change the remote key. See ../extras/secret.example.yaml for the result.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nom-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: networkops-secret-store
  target:
    name: nom-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # postgresql+psycopg://nom:<password>@<host>:5432/nom?sslmode=require
        NOM_DATABASE_URL: "{{ .database_url }}"
        NOM_REDIS_URL: "{{ .redis_url }}"
        NOM_JWT_SECRET: "{{ .jwt_secret }}"
        # comma separated Fernet keys, newest first
        NOM_ENCRYPTION_KEYS: "{{ .encryption_keys }}"
        NOM_LDAP_BIND_PASSWORD: "{{ .ldap_bind_password }}"
        NOM_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        NOM_SMTP_USERNAME: "{{ .smtp_username }}"
        NOM_SMTP_PASSWORD: "{{ .smtp_password }}"
        NOM_INIT_ADMIN_PASSWORD: "{{ .init_admin_password }}"
  dataFrom:
    - extract:
        key: networkops/production/app
---
# One agent token per tac_plus-ng replica (property name = pod name). Create TACACS servers
# named nom-tacacs-0, nom-tacacs-1, ... with POST /api/v1/tacacs/servers and store each
# returned agent_token under the matching property.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nom-tacacs-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: networkops-secret-store
  target:
    name: nom-tacacs-agent
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: networkops/production/tacacs-agent-tokens
