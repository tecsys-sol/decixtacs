apiVersion: v1
kind: Namespace
metadata:
  name: networkops
  labels:
    # Every workload in this namespace satisfies the "restricted" Pod Security Standard
    # (non-root, no privilege escalation, drop ALL, seccomp RuntimeDefault). The tac_plus-ng
    # pods use the safe sysctl net.ipv4.ip_unprivileged_port_start to bind :49 without caps.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
