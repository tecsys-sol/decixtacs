apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nom-api
  labels:
    release: kube-prometheus-stack   # match your Prometheus serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: networkops-manager
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Celery worker metrics (multiprocess exporter on :9808) - scheduled backups, compliance,
# alert delivery and integration sync counters are incremented in the workers.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nom-worker
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: networkops-manager
      app.kubernetes.io/component: worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
