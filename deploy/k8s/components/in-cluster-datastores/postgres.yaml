apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nom-postgres
  labels:
    app.kubernetes.io/component: postgres
spec:
  serviceName: nom-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: networkops-manager
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: networkops-manager
        app.kubernetes.io/component: postgres
        networkops.io/datastore: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # postgres user of the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: nom}
            - {name: POSTGRES_DB, value: nom}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: nom-db-app, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "nom", "-d", "nom"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "nom", "-d", "nom"]}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nom-postgres
  labels:
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: networkops-manager
    app.kubernetes.io/component: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nom-db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: networkops-secret-store
  target:
    name: nom-db-app
  data:
    - secretKey: password
      remoteRef: {key: networkops/staging/app, property: db_password}
