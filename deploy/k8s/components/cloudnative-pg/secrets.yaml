# Credentials for CNPG, from the same secret store as the application. The password here must
# match the one embedded in the database_url property used for NOM_DATABASE_URL
# (postgresql+psycopg://nom:<password>@nom-db-rw:5432/nom?sslmode=require).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nom-db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: networkops-secret-store
  target:
    name: nom-db-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: nom
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef: {key: networkops/production/app, property: db_password}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nom-db-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: networkops-secret-store
  target:
    name: nom-db-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: networkops/production/pg-backup, property: access_key_id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: networkops/production/pg-backup, property: secret_access_key}
