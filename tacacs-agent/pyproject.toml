[project]
name = "nom-tacacs-agent"
version = "0.1.0"
description = "NetworkOps Manager agent for tac_plus-ng: config pull/validate/reload, log shipping, session recording upload"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
nom-tacacs-agent = "nom_tacacs_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "S603", "S607", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
