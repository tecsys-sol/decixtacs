# Bootstrap configuration installed by the supervisor when no configuration exists yet.
# It only lets tac_plus-ng start: there are no devices (NAS clients) and no users, so every
# request is rejected until an operator deploys a revision in NetworkOps Manager
# (POST /api/v1/tacacs/servers/{id}/deploy) and the agent swaps it in.
id = spawnd {
	listen = { port = 49 }
	spawn = { instances min = 1 instances max = 4 }
	background = no
}

id = tac_plus-ng {
	log accesslog { destination = /var/log/tac_plus-ng/access.log }
	log authzlog { destination = /var/log/tac_plus-ng/authz.log }
	log acctlog { destination = /var/log/tac_plus-ng/acct.log }
	authentication log = accesslog
	authorization log = authzlog
	accounting log = acctlog
}
