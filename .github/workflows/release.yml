name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.3"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Image ${{ matrix.image }} (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless signing / provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: tacacs
            context: tacacs-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sdks:
    name: OpenAPI + SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Export OpenAPI
        working-directory: backend
        env:
          NOM_ENVIRONMENT: test
        run: |
          pip install -e .
          python -m app.cli export-openapi --output ../docs/api/openapi.json
      - name: Generate clients (openapi-generator-cli, python + go)
        run: make sdk
      - name: Test and build hand-written SDKs
        run: |
          pip install build -e "sdk/python[dev]"
          (cd sdk/python && pytest -q && python -m build --outdir ../../dist)
          (cd sdk/go/networkops && go test ./...)
      - name: Package artifacts
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp docs/api/openapi.json "dist/networkops-openapi-${VERSION}.json"
          tar -C sdk/generated -czf "dist/networkops-sdk-generated-python-${VERSION}.tar.gz" python
          tar -C sdk/generated -czf "dist/networkops-sdk-generated-go-${VERSION}.tar.gz" go
          tar -C sdk -czf "dist/networkops-sdk-go-${VERSION}.tar.gz" go
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [images, sdks]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            Container images (linux/amd64, linux/arm64):
            - `${{ env.IMAGE_PREFIX }}/backend:${{ inputs.tag || github.ref_name }}`
            - `${{ env.IMAGE_PREFIX }}/frontend:${{ inputs.tag || github.ref_name }}`
            - `${{ env.IMAGE_PREFIX }}/tacacs:${{ inputs.tag || github.ref_name }}`

            Attached: OpenAPI document, hand-written Python SDK (wheel/sdist), Go SDK source,
            and openapi-generator clients (python, go).
