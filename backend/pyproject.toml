[project]
name = "networkops-manager"
version = "0.1.0"
description = "NetworkOps Manager - Network Access & Configuration Management Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "passlib>=1.7.4",
  "cryptography>=42",
  "pyotp>=2.9",
  "ldap3>=2.9",
  "httpx>=0.27",
  "redis>=5.0",
  "celery>=5.4",
  "prometheus-client>=0.20",
  "gitpython>=3.1.43",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
collectors = [
  "nornir>=3.4",
  "nornir-scrapli>=2023.7.30",
  "nornir-netmiko>=1.0",  # registers the "netmiko" connection plugin used for non-Scrapli platforms
  "scrapli>=2024.1.30",
  "scrapli-cfg>=2023.7.30",
  "netmiko>=4.3",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "B008", "S105", "S106", "N818", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/models/__init__.py" = ["F401"]
"alembic/*" = ["E501", "F401", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
